<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sri Ram Enterprises - Billing & POS</title>
  
  <!-- PWA Metadata -->
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Core Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
    
    /* 80mm Thermal Receipt Geometry (Continuous Roll) */
    .thermal-receipt {
      width: 76mm;
      margin: 0 auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      line-height: 1.2;
      color: #000;
    }

    /* PWA Touch Optimizations */
    input, button, select { touch-action: manipulation; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Default Fallback Configuration
    const DEFAULT_CONFIG = {
      gasUrl: localStorage.getItem("SRE_GAS_URL") || "",
      businessName: "SRI RAM ENTERPRISES",
      tagline: "Mobile • Accessories • Repairing",
      address: "GB-15, CITY CENTRE, SECTOR-4, B.S. CITY, NEAR INDIAN BANK, BOKARO, JHARKHAND",
      phones: "9334765000, 9334237111, 9335136000",
      gstin: "20APOPK6864K1ZH",
      terms: "1. Goods once sold will not be returned.\n2. Brand warranty handled at service centers.\n3. Water/Physical damage voids all claim.\n4. Original tax invoice compulsory for claims."
    };

    // -------------------------------------------------------------
    // MAIN APP CONTROLLER
    // -------------------------------------------------------------
    function App() {
      const [staff, setStaff] = useState(() => JSON.parse(sessionStorage.getItem("SRE_AUTH") || "null"));
      const [view, setView] = useState("dashboard"); // dashboard, new_bill, bills, dues, reports, settings, public_bill
      const [appConfig, setAppConfig] = useState(DEFAULT_CONFIG);
      const [toast, setToast] = useState(null);
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [draftCount, setDraftCount] = useState(0);

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener("online", handleOnline);
        window.addEventListener("offline", handleOffline);
        refreshDraftCount();
        return () => {
          window.removeEventListener("online", handleOnline);
          window.removeEventListener("offline", handleOffline);
        };
      }, []);

      const showToast = (message, type = "info") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4500);
      };

      const refreshDraftCount = () => {
        const drafts = JSON.parse(localStorage.getItem("SRE_DRAFTS") || "[]");
        setDraftCount(drafts.length);
      };

      // Check URL for Public Bill View Token (#/bill/:token)
      useEffect(() => {
        const hash = window.location.hash;
        if (hash.startsWith("#/bill/")) {
          const token = hash.replace("#/bill/", "");
          if (token) {
            setView("public_bill");
          }
        }
      }, []);

      if (view === "public_bill") {
        const token = window.location.hash.replace("#/bill/", "");
        return <PublicBillView token={token} config={appConfig} />;
      }

      if (!staff) {
        return <LoginScreen setStaff={setStaff} config={appConfig} showToast={showToast} setAppConfig={setAppConfig} />;
      }

      return (
        <div class="flex flex-col md:flex-row min-h-screen">
          {/* Top Bar on Mobile */}
          <div class="md:hidden bg-blue-950 text-white flex items-center justify-between p-3 sticky top-0 z-40">
            <div class="flex items-center space-x-2">
              <span class="bg-amber-400 text-blue-950 font-black px-2 py-0.5 rounded text-xs">SRE</span>
              <span class="font-bold text-sm truncate">{appConfig.businessName}</span>
            </div>
            <div class="flex items-center space-x-2">
              {!isOnline && <span class="bg-rose-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">OFFLINE</span>}
              <button onClick={() => setView("new_bill")} class="bg-amber-400 text-blue-950 px-2.5 py-1 rounded text-xs font-bold">+ BILL</button>
            </div>
          </div>

          {/* Desktop Navigation Sidebar */}
          <aside class="hidden md:flex flex-col w-64 bg-slate-900 text-slate-300 border-r border-slate-800">
            <div class="p-4 border-b border-slate-800 flex items-center space-x-3">
              <div class="bg-amber-400 text-blue-950 font-black p-2 rounded-lg text-sm">SRE</div>
              <div>
                <h1 class="font-bold text-white text-sm leading-none">{appConfig.businessName}</h1>
                <p class="text-[10px] text-slate-400 mt-1">Bokaro Sector-4</p>
              </div>
            </div>

            <nav class="flex-1 p-3 space-y-1 text-sm">
              <NavItem active={view === "dashboard"} onClick={() => setView("dashboard")} label="Dashboard" icon="layout-dashboard" />
              <NavItem active={view === "new_bill"} onClick={() => setView("new_bill")} label="New Invoice" icon="receipt" />
              <NavItem active={view === "bills"} onClick={() => setView("bills")} label="All Bills & Register" icon="archive" />
              <NavItem active={view === "dues"} onClick={() => setView("dues")} label="Due Collection" icon="credit-card" />
              <NavItem active={view === "reports"} onClick={() => setView("reports")} label="Sales & GST Reports" icon="bar-chart-3" />
              {staff.role === "ADMIN" && (
                <NavItem active={view === "settings"} onClick={() => setView("settings")} label="Master Settings" icon="settings" />
              )}
            </nav>

            <div class="p-3 border-t border-slate-800 text-xs">
              <div class="flex justify-between items-center mb-2">
                <span class="text-slate-400">Status:</span>
                <span class={isOnline ? "text-emerald-400 flex items-center font-bold" : "text-rose-400 font-bold"}>
                  <span class={`inline-block w-2 h-2 rounded-full mr-1 ${isOnline ? "bg-emerald-400" : "bg-rose-400"}`}></span>
                  {isOnline ? "Live Cloud" : "Offline Drafts"}
                </span>
              </div>
              <div class="bg-slate-800/80 p-2.5 rounded-lg mb-2">
                <p class="font-bold text-white">{staff.fullName}</p>
                <p class="text-[11px] text-amber-400">{staff.role} ({staff.staffId})</p>
              </div>
              <button 
                onClick={() => { sessionStorage.removeItem("SRE_AUTH"); setStaff(null); }} 
                class="w-full text-center py-1.5 bg-slate-800 hover:bg-rose-950 hover:text-rose-300 rounded transition font-medium"
              >
                Log Out
              </button>
            </div>
          </aside>

          {/* Core Content Area */}
          <div class="flex-1 flex flex-col min-w-0">
            <main class="flex-1 p-3 sm:p-6 overflow-y-auto">
              {view === "dashboard" && <DashboardView setView={setView} config={appConfig} staff={staff} showToast={showToast} draftCount={draftCount} />}
              {view === "new_bill" && <NewBillView setView={setView} config={appConfig} staff={staff} showToast={showToast} refreshDraftCount={refreshDraftCount} />}
              {view === "bills" && <BillsRegisterView config={appConfig} staff={staff} showToast={showToast} />}
              {view === "dues" && <DuesManagementView config={appConfig} staff={staff} showToast={showToast} />}
              {view === "reports" && <ReportsView config={appConfig} staff={staff} showToast={showToast} />}
              {view === "settings" && <SettingsView config={appConfig} setConfig={setAppConfig} staff={staff} showToast={showToast} />}
            </main>

            {/* Mobile Bottom Navigation Bar */}
            <div class="md:hidden bg-white border-t border-slate-200 grid grid-cols-5 text-[10px] text-center p-1.5 sticky bottom-0 z-30 font-medium">
              <button onClick={() => setView("dashboard")} class={`p-1 ${view === "dashboard" ? "text-blue-900 font-bold" : "text-slate-500"}`}>
                Dashboard
              </button>
              <button onClick={() => setView("new_bill")} class={`p-1 ${view === "new_bill" ? "text-blue-900 font-bold" : "text-slate-500"}`}>
                + Bill
              </button>
              <button onClick={() => setView("bills")} class={`p-1 ${view === "bills" ? "text-blue-900 font-bold" : "text-slate-500"}`}>
                Register
              </button>
              <button onClick={() => setView("dues")} class={`p-1 ${view === "dues" ? "text-blue-900 font-bold" : "text-slate-500"}`}>
                Dues
              </button>
              <button onClick={() => setView("reports")} class={`p-1 ${view === "reports" ? "text-blue-900 font-bold" : "text-slate-500"}`}>
                Reports
              </button>
            </div>
          </div>

          {/* Floating Toast Notification Engine */}
          {toast && (
            <div class={`fixed bottom-14 md:bottom-5 right-5 z-50 px-4 py-2.5 rounded-lg shadow-xl text-white text-xs font-semibold flex items-center space-x-2 ${
              toast.type === "error" ? "bg-rose-600" : (toast.type === "success" ? "bg-emerald-600" : "bg-blue-900")
            }`}>
              <span>{toast.message}</span>
            </div>
          )}
        </div>
      );
    }

    function NavItem({ active, onClick, label, icon }) {
      return (
        <button
          onClick={onClick}
          class={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg font-medium transition ${
            active ? "bg-blue-900 text-white shadow" : "hover:bg-slate-800 text-slate-400 hover:text-white"
          }`}
        >
          <span>{label}</span>
        </button>
      );
    }

    // -------------------------------------------------------------
    // LOGIN SCREEN COMPONENT
    // -------------------------------------------------------------
    function LoginScreen({ setStaff, config, showToast, setAppConfig }) {
      const [username, setUsername] = useState("admin");
      const [password, setPassword] = useState("admin123");
      const [gasUrl, setGasUrl] = useState(config.gasUrl);
      const [loading, setLoading] = useState(false);
      const [showConfig, setShowConfig] = useState(!config.gasUrl);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!gasUrl) {
          showToast("Backend Google Apps Script URL is required.", "error");
          setShowConfig(true);
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: "POST",
            body: JSON.stringify({ action: "login", username, password })
          });
          const data = await res.json();
          if (data.success) {
            sessionStorage.setItem("SRE_AUTH", JSON.stringify(data.staff));
            setStaff(data.staff);
            showToast(`Welcome back, ${data.staff.fullName}!`, "success");
          } else {
            showToast(data.error || "Authentication failed.", "error");
          }
        } catch (err) {
          showToast("Network / CORS error: Verify Google Script deployment permissions.", "error");
        } finally {
          setLoading(false);
        }
      };

      const handleSaveGasUrl = () => {
        localStorage.setItem("SRE_GAS_URL", gasUrl);
        setAppConfig(prev => ({ ...prev, gasUrl }));
        showToast("Cloud Backend URL updated.", "success");
        setShowConfig(false);
      };

      return (
        <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
          <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
            <div class="text-center">
              <span class="inline-block bg-amber-400 text-blue-950 font-black px-3 py-1 rounded-lg text-sm mb-2">SRE</span>
              <h1 class="text-xl font-black text-slate-900 tracking-tight">{config.businessName}</h1>
              <p class="text-xs text-slate-500 font-medium">Bokaro Sector-4 • Enterprise POS</p>
            </div>

            <form onSubmit={handleLogin} class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Staff Username</label>
                <input 
                  type="text" 
                  value={username} 
                  onChange={e => setUsername(e.target.value)} 
                  required 
                  class="w-full p-2.5 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-blue-900 outline-none" 
                />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                <input 
                  type="password" 
                  value={password} 
                  onChange={e => setPassword(e.target.value)} 
                  required 
                  class="w-full p-2.5 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-blue-900 outline-none" 
                />
              </div>

              <button 
                type="submit" 
                disabled={loading}
                class="w-full bg-blue-950 hover:bg-blue-900 text-white font-bold py-3 rounded-lg text-sm shadow transition flex items-center justify-center space-x-2"
              >
                {loading ? <span>Verifying Credentials...</span> : <span>Open Register / Sign In</span>}
              </button>
            </form>

            <div class="pt-4 border-t border-slate-100 text-center">
              <button 
                onClick={() => setShowConfig(!showConfig)} 
                class="text-xs text-slate-500 hover:text-blue-900 font-medium underline"
              >
                {showConfig ? "Hide Cloud Gateway" : "Configure Cloud Backend Gateway"}
              </button>
            </div>

            {showConfig && (
              <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                <label class="block text-[11px] font-bold text-slate-700">Google Apps Script Web App URL</label>
                <input 
                  type="url" 
                  value={gasUrl} 
                  onChange={e => setGasUrl(e.target.value)} 
                  placeholder="https://script.google.com/macros/s/.../exec"
                  class="w-full p-2 border border-slate-300 rounded text-xs font-mono"
                />
                <button 
                  type="button" 
                  onClick={handleSaveGasUrl}
                  class="w-full py-1.5 bg-slate-800 text-white text-xs font-bold rounded hover:bg-slate-700"
                >
                  Save Gateway Connection
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // DASHBOARD COMPONENT
    // -------------------------------------------------------------
    function DashboardView({ setView, config, staff, showToast, draftCount }) {
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        loadDashboardReports();
      }, []);

      const loadDashboardReports = async () => {
        if (!config.gasUrl) return;
        const todayStr = new Date().toISOString().substring(0, 10);
        try {
          const res = await fetch(config.gasUrl, {
            method: "POST",
            body: JSON.stringify({ action: "getReports", startDate: todayStr, endDate: todayStr })
          });
          const data = await res.json();
          if (data.success) {
            setStats(data.report);
          }
        } catch (err) {
          showToast("Could not load real-time cloud metrics.", "error");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <h1 class="text-xl font-black text-slate-900">Today's POS Overview</h1>
              <p class="text-xs text-slate-500 font-medium">Bokaro Steel City Hub • Shift Operator: {staff.fullName}</p>
            </div>
            <div class="flex items-center space-x-2">
              <button 
                onClick={() => setView("new_bill")}
                class="bg-blue-950 hover:bg-blue-900 text-white text-xs font-bold px-4 py-2.5 rounded-lg shadow transition"
              >
                + Create New Invoice
              </button>
            </div>
          </div>

          {/* Quick Metrics */}
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <StatCard title="Today's Bills" value={loading ? "..." : (stats?.totalBills || 0)} subtext="Transactions Generated" color="blue" />
            <StatCard title="Gross Sales" value={loading ? "..." : `₹${(stats?.grossSales || 0).toLocaleString('en-IN')}`} subtext="Total Booked Value" color="amber" />
            <StatCard title="Collection" value={loading ? "..." : `₹${(stats?.totalCollection || 0).toLocaleString('en-IN')}`} subtext="Cash, QR & Bank" color="emerald" />
            <StatCard title="Today's Due" value={loading ? "..." : `₹${(stats?.totalDue || 0).toLocaleString('en-IN')}`} subtext="Pending Recovery" color="rose" />
          </div>

          {/* Breakdown by Revenue Vertical */}
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <VerticalCard title="Mobile Phones" amount={stats?.mobileSales || 0} icon="📱" onClick={() => setView("new_bill")} />
            <VerticalCard title="Accessories" amount={stats?.accessoriesSales || 0} icon="🎧" onClick={() => setView("new_bill")} />
            <VerticalCard title="Repair Services" amount={stats?.repairSales || 0} icon="🔧" onClick={() => setView("new_bill")} />
          </div>

          {/* Offline Draft Alert Banner */}
          {draftCount > 0 && (
            <div class="p-4 bg-amber-50 border border-amber-300 rounded-xl flex items-center justify-between">
              <div>
                <p class="text-xs font-bold text-amber-900">Offline Drafts Pending ({draftCount})</p>
                <p class="text-[11px] text-amber-700">Invoices saved locally while offline require atomic cloud synchronization.</p>
              </div>
              <button onClick={() => setView("bills")} class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-lg shadow">
                Review & Sync
              </button>
            </div>
          )}
        </div>
      );
    }

    function StatCard({ title, value, subtext, color }) {
      const colors = {
        blue: "border-blue-200 bg-blue-50/50 text-blue-950",
        amber: "border-amber-200 bg-amber-50/50 text-amber-950",
        emerald: "border-emerald-200 bg-emerald-50/50 text-emerald-950",
        rose: "border-rose-200 bg-rose-50/50 text-rose-950"
      };
      return (
        <div class={`p-4 rounded-xl border bg-white shadow-sm flex flex-col justify-between ${colors[color] || ""}`}>
          <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">{title}</span>
          <p class="text-2xl font-black my-1">{value}</p>
          <span class="text-[10px] text-slate-400 font-medium">{subtext}</span>
        </div>
      );
    }

    function VerticalCard({ title, amount, icon, onClick }) {
      return (
        <div class="p-4 bg-white rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
          <div>
            <span class="text-2xl mb-1 block">{icon}</span>
            <p class="text-xs font-bold text-slate-600">{title}</p>
            <p class="text-lg font-black text-slate-900">₹{amount.toLocaleString('en-IN')}</p>
          </div>
          <button onClick={onClick} class="text-xs font-bold text-blue-900 bg-blue-50 px-3 py-2 rounded-lg hover:bg-blue-100">
            + Bill
          </button>
        </div>
      );
    }

    // -------------------------------------------------------------
    // NEW BILL GENERATION ENGINE (MOBILE, ACCESSORIES, REPAIRS)
    // -------------------------------------------------------------
    function NewBillView({ setView, config, staff, showToast, refreshDraftCount }) {
      const [billType, setBillType] = useState("MOBILE SALE"); // MOBILE SALE, ACCESSORIES SALE, REPAIRING
      const [customer, setCustomer] = useState({ name: "", mobile: "", address: "", gstin: "" });
      const [items, setItems] = useState([createEmptyItem("MOBILE SALE")]);
      const [payments, setPayments] = useState({ cash: 0, qr: 0, card: 0, finance: 0, other: 0 });
      const [finance, setFinance] = useState({ company: "", downPayment: 0, loanAmount: 0, reference: "" });
      const [repair, setRepair] = useState({ deviceBrand: "", deviceModel: "", imei: "", complaint: "", repairingWork: "", partsUsed: "", labourCharge: 0 });
      const [isSaving, setIsSaving] = useState(false);
      const [savedSuccessData, setSavedSuccessData] = useState(null);

      function createEmptyItem(type) {
        return {
          itemType: type,
          brand: "",
          productName: "",
          model: "",
          colour: "",
          ram: "",
          storage: "",
          imei1: "",
          imei2: "",
          serialNumber: "",
          quantity: 1,
          rate: 0,
          discount: 0,
          gstPercent: 18
        };
      }

      // Auto-load customer profile when 10 digits entered
      const handleMobileChange = async (mobileVal) => {
        const clean = mobileVal.replace(/\D/g, "");
        setCustomer(prev => ({ ...prev, mobile: clean }));

        if (clean.length === 10 && config.gasUrl) {
          try {
            const res = await fetch(config.gasUrl, {
              method: "POST",
              body: JSON.stringify({ action: "getCustomers", query: clean })
            });
            const data = await res.json();
            if (data.success && data.customers && data.customers.length > 0) {
              const matched = data.customers[0];
              setCustomer({
                name: matched.name,
                mobile: matched.mobile,
                address: matched.address,
                gstin: matched.gstin || ""
              });
              showToast("Existing customer found & autofilled!", "info");
            }
          } catch (e) {
            // Non-blocking query failure
          }
        }
      };

      // Math Engine
      const totals = useMemo(() => {
        let subtotal = 0;
        let discount = 0;
        let taxable = 0;
        let totalGst = 0;

        const isInterstate = customer.gstin && !customer.gstin.startsWith("20");

        items.forEach(it => {
          const lineGross = (it.quantity || 1) * (it.rate || 0);
          const lineTaxable = Math.max(0, lineGross - (it.discount || 0));
          const gstRate = parseFloat(it.gstPercent) || 0;
          const lineGst = lineTaxable * (gstRate / 100);

          subtotal += lineGross;
          discount += (it.discount || 0);
          taxable += lineTaxable;
          totalGst += lineGst;
        });

        if (billType === "REPAIRING") {
          const labour = parseFloat(repair.labourCharge) || 0;
          taxable += labour;
          totalGst += (labour * 0.18); // Standard 18% on Labour Service
          subtotal += labour;
        }

        const grandTotal = Math.round(taxable + totalGst);
        const totalPaid = (parseFloat(payments.cash) || 0) + 
                          (parseFloat(payments.qr) || 0) + 
                          (parseFloat(payments.card) || 0) + 
                          (parseFloat(payments.finance) || 0) + 
                          (parseFloat(payments.other) || 0);
        const dueAmount = Math.max(0, grandTotal - totalPaid);

        return {
          subtotal: Math.round(subtotal * 100) / 100,
          discount: Math.round(discount * 100) / 100,
          taxable: Math.round(taxable * 100) / 100,
          totalGst: Math.round(totalGst * 100) / 100,
          grandTotal: grandTotal,
          totalPaid: Math.round(totalPaid * 100) / 100,
          dueAmount: Math.round(dueAmount * 100) / 100
        };
      }, [items, payments, billType, repair, customer.gstin]);

      const handleSaveBill = async () => {
        // Validation Checks
        if (!customer.name.trim()) return showToast("Customer Name is required.", "error");
        if (customer.mobile.length !== 10) return showToast("Valid 10-Digit Mobile is required.", "error");

        if (billType === "MOBILE SALE") {
          for (let i = 0; i < items.length; i++) {
            const it = items[i];
            if (!it.productName) return showToast(`Line ${i + 1}: Model/Product Name is required.`, "error");
            if (!it.imei1 || it.imei1.length !== 15) {
              return showToast(`Line ${i + 1}: IMEI 1 must be strictly 15 digits.`, "error");
            }
          }
        }

        if (totals.totalPaid > totals.grandTotal) {
          return showToast("Total Paid exceeds Grand Total. Adjust payments.", "error");
        }

        const billPayload = {
          billType,
          billDate: new Date().toISOString().substring(0, 10),
          customer,
          items,
          payments,
          finance: payments.finance > 0 ? finance : null,
          repairDetails: billType === "REPAIRING" ? repair : null,
          appDomain: window.location.origin + window.location.pathname
        };

        // Offline Guard
        if (!navigator.onLine) {
          const drafts = JSON.parse(localStorage.getItem("SRE_DRAFTS") || "[]");
          drafts.push({ ...billPayload, localDraftId: "DRAFT-" + Date.now() });
          localStorage.setItem("SRE_DRAFTS", JSON.stringify(drafts));
          refreshDraftCount();
          showToast("Internet unavailable: Saved as Local Draft!", "info");
          setView("dashboard");
          return;
        }

        setIsSaving(true);
        try {
          const res = await fetch(config.gasUrl, {
            method: "POST",
            body: JSON.stringify({ action: "createBill", billData: billPayload, staff })
          });
          const data = await res.json();
          if (data.success) {
            setSavedSuccessData(data);
            showToast("Invoice recorded and synchronized with Google Cloud!", "success");
          } else {
            showToast(data.error || "Server validation rejected invoice.", "error");
          }
        } catch (err) {
          showToast("Cloud sync failed. Connection timeout.", "error");
        } finally {
          setIsSaving(false);
        }
      };

      if (savedSuccessData) {
        return (
          <SuccessReceiptScreen 
            data={savedSuccessData} 
            config={config} 
            onReset={() => {
              setSavedSuccessData(null);
              setCustomer({ name: "", mobile: "", address: "", gstin: "" });

              setPayments({ cash: 0, qr: 0, card: 0, finance: 0, other: 0 });

      return (

    // -------------------------------------------------------------
    // POST-SALE TRANSACTION SUCCESS & EXPORT ENGINE
    // -------------------------------------------------------------
    function SuccessReceiptScreen({ data, config, onReset }) {
      const qrCanvasRef = useRef(null);
      const [qrGenerated, setQrGenerated] = useState(false);

      useEffect(() => {
        if (data.publicUrl && qrCanvasRef.current) {
          qrCanvasRef.current.innerHTML = "";
          new QRCode(qrCanvasRef.current, {
            text: data.publicUrl,
            width: 140,
            height: 140,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
          setQrGenerated(true);
        }
      }, [data.publicUrl]);

      const handleWhatsAppShare = () => {
        const phone = "91" + data.customer.mobile;
        const msg = `Hello ${data.customer.name} 👋\n\nThank you for shopping with *Sri Ram Enterprises*.\n\n*Invoice No:* ${data.invoiceNo}\n*Total Amount:* ₹${data.totals.grandTotal}\n*Paid:* ₹${data.totals.totalPaid}\n*Due:* ₹${data.totals.dueAmount}\n\nView / Download Official Invoice:\n${data.publicUrl}\n\nThank you for your business! 🙏`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
      };

      const handleA4PdfDownload = () => {
        const doc = new jspdf.jsPDF();
        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);
        doc.text(config.businessName, 105, 15, { align: "center" });
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text(config.tagline, 105, 21, { align: "center" });
        doc.text(config.address, 105, 26, { align: "center" });
        doc.text(`GSTIN: ${config.gstin} | Contact: ${config.phones}`, 105, 31, { align: "center" });
        doc.line(10, 35, 200, 35);

        doc.setFont("helvetica", "bold");
        doc.text(`TAX INVOICE: ${data.invoiceNo}`, 10, 42);
        doc.setFont("helvetica", "normal");
        doc.text(`Date: ${new Date().toLocaleDateString('en-IN')}`, 150, 42);
        doc.text(`Customer: ${data.customer.name} (${data.customer.mobile})`, 10, 48);
        doc.text(`Address: ${data.customer.address || "Bokaro"}`, 10, 54);

        doc.line(10, 58, 200, 58);
        doc.text("Grand Total:", 130, 70);
        doc.setFont("helvetica", "bold");
        doc.text(`Rs. ${data.totals.grandTotal.toLocaleString('en-IN')}`, 170, 70);
        doc.text("Paid Amount:", 130, 76);
        doc.text(`Rs. ${data.totals.totalPaid.toLocaleString('en-IN')}`, 170, 76);
        doc.text("Balance Due:", 130, 82);
        doc.text(`Rs. ${data.totals.dueAmount.toLocaleString('en-IN')}`, 170, 82);

        doc.save(`${data.invoiceNo}.pdf`);
      };

      const handleThermalPrint = () => {
        window.print();
      };

      return (
        <div class="max-w-md mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-xl space-y-5 text-center">
          <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-black">
            ✓
          </div>

          <div>
            <h1 class="text-xl font-black text-slate-900">BILL CREATED & STORED</h1>
            <p class="text-xs font-mono font-bold text-blue-900 mt-1">{data.invoiceNo}</p>
          </div>

          <div class="p-3.5 bg-slate-50 rounded-xl space-y-1 text-xs text-left font-medium">
            <div class="flex justify-between">
              <span class="text-slate-500">Customer:</span>
              <span class="font-bold text-slate-800">{data.customer.name}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-500">Grand Total:</span>
              <span class="font-bold text-slate-900">₹{data.totals.grandTotal.toLocaleString('en-IN')}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-500">Amount Paid:</span>
              <span class="font-bold text-emerald-600">₹{data.totals.totalPaid.toLocaleString('en-IN')}</span>
            </div>
            <div class="flex justify-between border-t pt-1">
              <span class="text-slate-500">Outstanding Due:</span>
              <span class="font-bold text-rose-600">₹{data.totals.dueAmount.toLocaleString('en-IN')}</span>
            </div>
          </div>

          {/* QR Container */}
          <div class="flex flex-col items-center justify-center space-y-1">
            <div ref={qrCanvasRef} class="p-2 border rounded-lg bg-white shadow-sm"></div>
            <span class="text-[10px] text-slate-400 font-bold">Public Verification QR</span>
          </div>

          {/* Action Row */}
          <div class="grid grid-cols-2 gap-2 text-xs font-bold">
            <button onClick={handleWhatsAppShare} class="p-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg shadow">
              Send WhatsApp
            </button>
            <button onClick={handleThermalPrint} class="p-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg shadow">
              Print 80mm
            </button>
            <button onClick={handleA4PdfDownload} class="p-2.5 bg-blue-950 hover:bg-blue-900 text-white rounded-lg shadow">
              Download PDF
            </button>
            <button onClick={() => { navigator.clipboard.writeText(data.publicUrl); alert("Copied!"); }} class="p-2.5 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200">
              Copy Bill Link

    // -------------------------------------------------------------
    // DUES RECOVERY ENGINE
    // -------------------------------------------------------------
    function DuesManagementView({ config, staff, showToast }) {
      const [dueBills, setDueBills] = useState([]);
      const [selectedBill, setSelectedBill] = useState(null);
      const [paymentAmount, setPaymentAmount] = useState("");
      const [paymentType, setPaymentType] = useState("Cash");

      useEffect(() => {
        fetchDues();
      }, []);

      const fetchDues = async () => {
        if (!config.gasUrl) return;
        try {
          const res = await fetch(config.gasUrl, {
            method: "POST",
            body: JSON.stringify({ action: "getBills", staff })
          });
          const data = await res.json();
          if (data.success) {
            setDueBills(data.bills.filter(b => parseFloat(b.due) > 0));
          }
        } catch (e) {
          showToast("Failed to load outstanding ledger.", "error");
        }
      };

      const handleAddPayment = async () => {
        if (!paymentAmount || parseFloat(paymentAmount) <= 0) {
          return showToast("Enter a valid installment amount.", "error");
        }
        if (parseFloat(paymentAmount) > parseFloat(selectedBill.due)) {
          return showToast("Payment exceeds current outstanding due balance.", "error");
        }

        try {
          const res = await fetch(config.gasUrl, {
            method: "POST",
            body: JSON.stringify({
              action: "addDuePayment",
              paymentData: {
                invoiceNo: selectedBill.invoiceNo,
                amount: parseFloat(paymentAmount),
                paymentType: paymentType
              },
              staff
            })
          });
          const data = await res.json();
          if (data.success) {
            showToast("Installment payment credited successfully!", "success");
            setSelectedBill(null);
            setPaymentAmount("");
            fetchDues();
          } else {
            showToast(data.error || "Update transaction failed.", "error");
          }
        } catch (e) {
          showToast("Network error submitting installment.", "error");
        }
      };

      return (
        <div class="space-y-4">
          <div>
            <h1 class="text-xl font-black text-slate-900">Outstanding Due Recovery</h1>
            <p class="text-xs text-slate-500 font-medium">Customer Credit Management & Payment Allocation</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
              <div class="p-3 bg-slate-50 border-b font-bold text-xs text-slate-700">Pending Accounts Receivable</div>
              <div class="divide-y divide-slate-100 max-h-96 overflow-y-auto">
                {dueBills.map(b => (
                  <div key={b.invoiceNo} onClick={() => setSelectedBill(b)} class={`p-3 cursor-pointer transition ${selectedBill?.invoiceNo === b.invoiceNo ? "bg-blue-50/70" : "hover:bg-slate-50"}`}>
                    <div class="flex justify-between items-start">
                      <div>
                        <p class="font-bold text-xs text-slate-900">{b.customerName}</p>
                        <p class="text-[10px] text-slate-500 font-mono">{b.customerMobile}</p>
                        <p class="text-[10px] text-blue-900 font-bold mt-1">{b.invoiceNo}</p>
                      </div>
                      <div class="text-right">
                        <span class="text-xs font-black text-rose-600 block">Due: ₹{b.due}</span>
                        <span class="text-[10px] text-slate-400">Total: ₹{b.grandTotal}</span>
                      </div>
                    </div>
                  </div>
                ))}
                {dueBills.length === 0 && <p class="p-4 text-center text-xs text-slate-400">All customer dues cleared!</p>}
              </div>
            </div>

            {/* Payment Input Card */}
            <div>
              {selectedBill ? (
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-4">
                  <h3 class="text-xs font-black uppercase text-slate-500 tracking-wider">Record Installment: {selectedBill.invoiceNo}</h3>
                  <div class="p-3 bg-slate-50 rounded-lg text-xs space-y-1">
                    <p><span class="text-slate-500">Customer:</span> <strong>{selectedBill.customerName}</strong> ({selectedBill.customerMobile})</p>
                    <p><span class="text-slate-500">Remaining Balance:</span> <strong class="text-rose-600">₹{selectedBill.due}</strong></p>
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Installment Amount (₹)</label>
                    <input 
                      type="number" 
                      value={paymentAmount} 
                      onChange={e => setPaymentAmount(e.target.value)} 
                      placeholder="0.00"
                      class="w-full p-2.5 border rounded-lg text-sm font-bold"
                    />
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Payment Method</label>
                    <select value={paymentType} onChange={e => setPaymentType(e.target.value)} class="w-full p-2.5 border rounded-lg text-xs font-bold">
                      <option value="Cash">Cash</option>
                      <option value="QR">QR / UPI</option>
                      <option value="Card">Card</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>

                  <button 
                    onClick={handleAddPayment}
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-xs shadow transition"
                  >
                    Credit Installment Payment
                  </button>
                </div>
              ) : (
                <div class="bg-white p-8 rounded-xl border border-dashed text-center text-xs text-slate-400">
                  Select a bill from the left list to settle pending dues.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }
